---
layout: base
---
<!--
  Page layout — for general pages (home, projects list, about, etc.)

  Front matter options:
    show_title: true   → displays page.title as an <h1 class="title">
    wide: true         → uses the wider 1100px container instead of 768px
-->

<article class="article-wrapper">
  <div class="{% if page.wide %}container-wide{% else %}container{% endif %}">
    {% if page.show_title %}
    <header class="article-header">
      <h1 class="title">{{ page.title }}</h1>
    </header>
    {% endif %}

    <div class="content">
      {{ content }}
    </div>
  </div>
</article>
