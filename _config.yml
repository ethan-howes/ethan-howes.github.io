# ── Site settings ──────────────────────────────────────────
title: Ethan Howes
email: ethanhowes06@gmail.com
description: >-
  Ethan Howes's personal website and projects.
baseurl: ""                          # leave empty for user sites (username.github.io)
url: "https://ethan-howes.github.io"

github_username:   ethan-howes
linkedin_username: ethan-howes06

author:
  name:  "Ethan Howes"
  email: "ethanhowes06@gmail.com"

# ── Defaults ────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
    values:
      layout: page

# ── Theme ───────────────────────────────────────────────────
theme: null   # disable GitHub Pages' default Primer theme; use _layouts/ instead

# ── Build ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed

# ── Exclude from published site ────────────────────────────
exclude:
  - PROJECT.md
  - README.md
